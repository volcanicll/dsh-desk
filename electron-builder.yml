appId: io.github.volcanicll.dsh-desk
productName: DSH Desk
copyright: Copyright © 2026 volcanicll
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - package.json
  - "!resources/**"
  - "!node_modules/**/*"
extraResources:
  - from: resources/node
    to: node
    filter: ["**/*"]
  # Point at node_modules (not resources/dsh) so electron-builder does not
  # treat the npm --prefix install as an app project and prune its deps.
  - from: resources/dsh/node_modules
    to: dsh/node_modules
    filter: ["**/*"]
  - from: resources/dsh/version.json
    to: dsh/version.json
npmRebuild: false
# Generate latest-mac.yml / latest.yml update metadata for GitHub Releases.
# Uploads are driven by the release workflow (electron-builder --publish never).
publish:
  provider: github
  owner: volcanicll
  repo: dsh-desk
mac:
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]
