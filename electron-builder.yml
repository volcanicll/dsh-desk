appId: io.github.volcanicll.dsh-desk
productName: DSH Desk
copyright: Copyright © 2026 DSH Desk contributors
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - package.json
  - "!resources/**"
  - "!node_modules/**/*"
extraResources:
  - from: resources/node
    to: node
    filter: ["**/*"]
  # Point at node_modules (not resources/dsh) so electron-builder does not
  # treat the npm --prefix install as an app project and prune its deps.
  - from: resources/dsh/node_modules
    to: dsh/node_modules
    filter: ["**/*"]
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  target:
    - target: AppImage
      arch: [x64, arm64]
