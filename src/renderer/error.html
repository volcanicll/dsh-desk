<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSH Desk — Error</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #e6edf3; font: 14px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 32px;
    }
    .card { max-width: 640px; width: 100%; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #f85149; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 14px; color: #c9d1d9; font-size: 12px; max-height: 260px; overflow: auto; }
    .actions { margin-top: 20px; display: flex; gap: 10px; }
    button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 9px 18px; font-size: 14px; cursor: pointer; }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="card">
    <h1>DeepSeek Harness failed to start</h1>
    <pre id="message">Loading…</pre>
    <div class="actions">
      <button id="restart">Restart dsh</button>
      <button id="quit" class="secondary">Quit</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search)
    document.getElementById('message').textContent = params.get('message') || 'Unknown error'
    document.getElementById('restart').addEventListener('click', () => window.desktopAPI?.restart())
    document.getElementById('quit').addEventListener('click', () => window.close())
  </script>
</body>
</html>
